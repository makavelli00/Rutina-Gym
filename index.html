<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutina Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#F2F4F7;--sf:#fff;--s2:#EEF0F4;--bd:#DEE1E8;--tx:#161821;--mu:#5B6275;--ac:#0B93A8;--ak:#fff;--li:#4E8F0F;--lk:#fff;--wa:#B4740F;--dg:#C43A4D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0C10;--sf:#14171E;--s2:#1B1F29;--bd:#262C3A;--tx:#F2F4F8;--mu:#8B93A6;--ac:#22E1FF;--ak:#04191E;--li:#B6FF3C;--lk:#0E1A02;--wa:#F5A623;--dg:#FF5A6E}}
:root[data-theme="dark"]{--bg:#0A0C10;--sf:#14171E;--s2:#1B1F29;--bd:#262C3A;--tx:#F2F4F8;--mu:#8B93A6;--ac:#22E1FF;--ak:#04191E;--li:#B6FF3C;--lk:#0E1A02;--wa:#F5A623;--dg:#FF5A6E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:720px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:17px;margin-bottom:10px}
.mono,input,.badge,.num{font-family:'IBM Plex Mono',ui-monospace,monospace}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{border:0;border-radius:12px;padding:12px 18px;font:600 14px 'IBM Plex Sans',sans-serif;background:var(--ac);color:var(--ak);cursor:pointer}
.btn.li{background:var(--li);color:var(--lk)}.btn.gh{background:none;border:1px solid var(--bd);color:var(--mu)}
.btn:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--sf);color:var(--mu);border-radius:20px;padding:7px 14px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer}
.chip.on{background:var(--ac);color:var(--ak);border-color:var(--ac)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.wd{text-align:center;font-size:12px;color:var(--mu);padding:8px 0;border-radius:10px;border:1px solid var(--bd);background:var(--sf)}
.wd b{display:block;font-size:15px;color:var(--tx)}.wd.t{border-color:var(--ac)}.wd.d{background:var(--li);border-color:var(--li)}.wd.d,.wd.d b{color:var(--lk)}
.ex{border:1px solid var(--bd);border-radius:14px;background:var(--sf);margin-bottom:10px}
.ex summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ex summary::-webkit-details-marker{display:none}
.ex[open] summary{border-bottom:1px solid var(--bd)}
.en{font-weight:600}.badge{font-size:12px;background:var(--s2);border-radius:8px;padding:3px 9px;color:var(--mu);white-space:nowrap}.badge.ok{background:var(--li);color:var(--lk)}
.bd{padding:14px 16px}
.tip{font-size:13px;color:var(--mu);margin:0 0 10px}
.sg{font-size:13px;border-left:3px solid var(--ac);padding:6px 10px;background:var(--s2);border-radius:0 8px 8px 0;margin-bottom:12px}.sg.up{border-color:var(--li)}.sg.hold{border-color:var(--wa)}
.row{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
input,select,textarea{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px}
select{font-family:'IBM Plex Sans',sans-serif;margin-bottom:10px}
.ck{height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--mu);font-size:18px;cursor:pointer}.ck.on{background:var(--li);border-color:var(--li);color:var(--lk)}
.lab{font-size:12px;color:var(--mu);margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cell{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--sf)}
.num{font-size:24px;font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--s2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%}
.li2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li2:last-child{border:0}
.cel{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--li);background:var(--sf);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:12px}.seg button{flex:1;border:0;background:var(--sf);color:var(--mu);padding:10px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer}.seg .on{background:var(--ac);color:var(--ak)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 12px 'IBM Plex Sans',sans-serif;padding:8px 0;cursor:pointer}nav .on{color:var(--ac)}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ac);border-radius:40px;padding:8px 14px 8px 8px;z-index:30;min-width:230px}
#fab.on{display:flex}#fab.dn{border-color:var(--li)}
#fab svg{flex:none}#fab .t{font:600 22px 'IBM Plex Mono',monospace;flex:1;color:var(--ac)}#fab.dn .t{color:var(--li)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="v"></div>
<div id="fab"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--s2)" stroke-width="4"/><circle id="ring" cx="22" cy="22" r="18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" transform="rotate(-90 22 22)" style="color:var(--ac)"/></svg><span class="t" id="tm">2:00</span><button class="btn gh" data-a="skip" style="padding:7px 12px">Saltar</button></div>
<div id="toast"></div>
<nav id="nav"><button data-a="tab" data-x="hoy">Hoy</button><button data-a="tab" data-x="prog">Progreso</button><button data-a="tab" data-x="hist">Historial</button><button data-a="tab" data-x="ajus">Nutrición</button></nav>
<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=(id,n,s,a,b,r,m,t)=>({id,n:n.split('|'),s,a,b,r,m,t});
const DAYS=[
{k:'ta',l:'Torso A',x:[
E('ta1','Press inclinado mancuernas|Press inclinado Multipower',3,6,10,'1–2',[['Pecho',1],['Tríceps',.5]],'Banco a 30–35°, escápulas retraídas, codos a 45°. Baja hasta rozar la parte alta del pecho.'),
E('ta2','Jalón al pecho prono',3,8,12,'1',[['Espalda',1],['Bíceps',.5]],'Agarre a la anchura de hombros. Estira arriba y deprime las escápulas al tirar hacia el pecho.'),
E('ta3','Press plano en máquina',3,8,12,'0–1',[['Pecho',1],['Tríceps',.5]],'Asiento con los agarres a media altura del pecho. Empuja recto y baja controlando.'),
E('ta4','Remo en T|Remo bilateral apalancado',3,8,12,'1–2',[['Espalda',1],['Bíceps',.5]],'Codos a 45° del torso. Junta los omóplatos al final del tirón con el pecho fuera.'),
E('ta5','Elevaciones laterales en polea',4,10,15,'0–1',[['Hombro',1]],'Polea a la altura de la cadera. Inclínate unos 30° para alinear el cable con el deltoides lateral.'),
E('ta6','Curl inclinado con mancuernas',3,8,12,'1–2',[['Bíceps',1]],'Banco a 45–60°. Deja colgar los brazos tras el torso y flexiona sin adelantar el hombro.'),
E('ta7','Extensión tras nuca en polea|Press francés',3,8,12,'1',[['Tríceps',1]],'Brazos sobre la cabeza (más de 90° de hombro). Codos fijos, extiende solo los antebrazos.')]},
{k:'pa',l:'Pierna A',x:[
E('pa1','Sentadilla Hack|Prensa de piernas',4,6,10,'1–2',[['Cuádriceps',1],['Glúteo',.5]],'Baja profundo para el máximo estiramiento del cuádriceps.'),
E('pa2','Curl femoral sentado',4,8,12,'0–1',[['Isquios',1]],'Con la cadera flexionada, el isquio trabaja muy estirado: estímulo superior a la versión tumbada.'),
E('pa3','Extensión de rodilla en máquina',3,10,15,'0–1',[['Cuádriceps',1]],'Aislamiento puro, sin carga sobre espalda ni cadera.'),
E('pa4','Peso muerto rumano',3,8,10,'1–2',[['Isquios',1],['Glúteo',.5]],'Cadera atrás, rodillas semiflexionadas, barra pegada a los muslos hasta notar el estiramiento.'),
E('pa5','Elevación de talones en máquina',4,10,15,'0',[['Gemelos',1]],'Usa un escalón. Pausa de 1 s abajo en estiramiento y sube explosivo.')]},
{k:'tb',l:'Torso B',x:[
E('tb1','Fondos en paralelas|Press banca plano',3,8,12,'1–2',[['Pecho',1],['Tríceps',.5]],'En fondos, torso inclinado 45° y piernas atrás para cargar el pectoral.'),
E('tb2','Remo unilateral con mancuerna|Remo en palanca',3,8,12,'0–1',[['Espalda',1],['Bíceps',.5]],'Codo pegado al costado, dirigido a la cadera. Controla la bajada.'),
E('tb3','Cruce de poleas|Pec Deck',3,10,15,'0',[['Pecho',1]],'Codos semiflexionados. Junta las manos con contracción y abre con estiramiento seguro.'),
E('tb4','Press militar con mancuernas|Press militar en máquina',3,8,10,'1–2',[['Hombro',1],['Tríceps',.5]],'Banco a 80–85° para estabilizar el tronco y progresar con seguridad.'),
E('tb5','Pájaros en máquina|Face Pull',3,12,15,'0–1',[['Hombro post.',1]],'Brazos a la altura de los hombros en "T". En face pull, tira a la cara con rotación externa.'),
E('tb6','Curl predicador (Scott)|Curl martillo',3,10,12,'0–1',[['Bíceps',1]],'Scott enfoca la cabeza corta; el martillo (agarre neutro) trabaja el braquial.'),
E('tb7','Pushdown de tríceps en polea',3,10,15,'0–1',[['Tríceps',1]],'Brazo pegado al torso, sin mover el hombro: extensión pura de codo.')]},
{k:'pb',l:'Pierna B',x:[
E('pb1','Zancadas|Sentadilla búlgara',3,8,12,'1–2',[['Cuádriceps',1],['Glúteo',.5]],'Bajada controlada sin golpear la rodilla trasera y tronco estable. Series por pierna.'),
E('pb2','Curl femoral tumbado',3,8,12,'0–1',[['Isquios',1]],'Fatiga el isquio con poco daño articular para recuperar rápido.'),
E('pb3','Aducción en máquina',3,12,15,'0–1',[['Aductores',1]],'Abre bien las piernas para el máximo estiramiento antes de juntar las rodillas.'),
E('pb4','Hip thrust en Multipower|Hip thrust con barra',3,8,12,'1',[['Glúteo',1],['Isquios',.5]],'Escápulas en el banco, extensión completa de cadera y pausa arriba.'),
E('pb5','Elevación de talones',4,10,15,'0',[['Gemelos',1]],'Rango completo, pausa de 1 s abajo.')]}];
const EX={};DAYS.forEach(d=>d.x.forEach(e=>EX[e.id]=e));
const MU=['Pecho','Espalda','Hombro','Hombro post.','Tríceps','Bíceps','Cuádriceps','Isquios','Glúteo','Gemelos','Aductores'];
const KEY='rutina_gym_v3';
let S={p:{bw:80,sex:'M',goal:'lean',rest:120},cy:0,ss:[],act:null,bw:[],cel:null};
try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(S,o);S.p=Object.assign({bw:80,sex:'M',goal:'lean',rest:120},o.p)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab='hoy',pick=null,OP=new Set(),T={end:0,iv:0},tt=0;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)};
const dn=k=>DAYS.find(d=>d.k==k),fd=(i,o)=>new Date(i).toLocaleDateString('es-ES',o||{weekday:'short',day:'numeric',month:'short'});
const MON=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const e1=(w,r)=>w*(1+r/30),rd=(n,d=1)=>Math.round(n*10**d)/10**d;
function last(id){for(const s of S.ss){const l=s.logs[id];if(l&&l.sets.length)return l.sets}return null}
function sug(e,sets){const w=Math.max(...sets.map(s=>s.w));
 if(sets.every(s=>s.r>=e.b)){let n=Math.round(w*1.025*2)/2;if(n<=w)n=w+.5;return{t:'up',w:n,p:rd((n/w-1)*100),m:`Completaste ${e.b} reps en todas las series: sube a ${n} kg.`}}
 if(sets.some(s=>s.r<e.a))return{t:'hold',w,m:`Quedaste bajo ${e.a} reps: mantén ${w} kg y cuida la técnica.`};
 return{t:'',w,m:`Mantén ${w} kg e intenta sumar 1–2 repeticiones.`}}
function startS(k){const logs={};dn(k).x.forEach(e=>{const l=last(e.id),g=l&&sug(e,l);logs[e.id]={v:0,sets:Array.from({length:e.s},()=>({w:g?g.w:'',r:'',ok:false}))}});
 S.act={k,date:new Date().toISOString(),logs,notes:''};save()}
function finish(){const a=S.act;let n=0,cel=null;const logs={};
 for(const id in a.logs){const l=a.logs[id],sets=l.sets.filter(s=>s.ok&&+s.w>0&&+s.r>0).map(s=>({w:+s.w,r:+s.r}));
  if(sets.length){n+=sets.length;logs[id]={v:l.v,sets};const g=sug(EX[id],sets);if(g.t=='up'&&!cel)cel={n:EX[id].n[l.v],w:g.w,p:g.p}}}
 if(!n){toast('Marca al menos una serie completada');return}
 S.ss.unshift({id:Date.now().toString(36),k:a.k,date:a.date,dur:Math.max(1,Math.round((Date.now()-new Date(a.date))/6e4)),notes:a.notes,logs});
 S.cy=(DAYS.findIndex(d=>d.k==a.k)+1)%4;S.cel=cel;S.act=null;pick=null;save();stopT();toast('Entrenamiento guardado');render()}
function flat(act){const o=[];const add=(s,date)=>{for(const id in s.logs)s.logs[id].sets.forEach(x=>{if(x.ok===false)return;if(+x.w>0&&+x.r>0)o.push({id,w:+x.w,r:+x.r,date})})};
 S.ss.forEach(s=>add(s,s.date));if(act&&S.act)add(S.act,S.act.date);return o}
function weekStats(){const m=MON().toISOString(),f=flat(1).filter(s=>s.date>=m),v={};MU.forEach(x=>v[x]=0);let t=0;
 f.forEach(s=>{t+=s.w*s.r;EX[s.id].m.forEach(p=>v[p[0]]+=p[1])});return{v,t:Math.round(t),n:f.length}}
function sp(a){if(a.length<2)return'';const w=120,h=28,mn=Math.min(...a),r=Math.max(...a)-mn||1;
 return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline points="${a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/></svg>`}
const rest=()=>`<div class="chips">${[60,90,120,180].map(s=>`<button class="chip ${S.p.rest==s?'on':''}" data-a="rest" data-x="${s}">${s>=120?s/60+' min':s+' s'}</button>`).join('')}</div>`;
const cel=()=>S.cel?`<div class="cel"><div><b>Subida de carga</b><div class="mu">${esc(S.cel.n)}: ${S.cel.w} kg (+${S.cel.p}%)</div></div><button class="btn gh" data-a="cel" style="padding:8px 12px">Cerrar</button></div>`:'';
/* ---- vistas ---- */
function vHoy(){const days=new Set(S.ss.map(s=>new Date(s.date).toDateString()));if(S.act)days.add(new Date(S.act.date).toDateString());
 const m=MON(),td=new Date().toDateString();
 const wk=['L','M','X','J','V','S','D'].map((l,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);const s=d.toDateString();return`<div class="wd ${days.has(s)?'d':''} ${s==td?'t':''}">${l}<b>${d.getDate()}</b></div>`}).join('');
 let h=`<h1>Rutina Gym</h1><p class="mu" style="margin:2px 0 0">${fd(new Date(),{weekday:'long',day:'numeric',month:'long'})}</p><div class="week">${wk}</div>${cel()}`;
 if(!S.act){const k=pick||DAYS[S.cy].k,d=dn(k);
  h+=`<div class="card"><h2>¿Qué toca hoy?</h2><div class="chips">${DAYS.map((x,i)=>`<button class="chip ${x.k==k?'on':''}" data-a="pick" data-x="${x.k}">${x.l}${i==S.cy?' ·  siguiente':''}</button>`).join('')}</div>
  <p class="mu">${d.x.length} ejercicios: ${d.x.map(e=>esc(e.n[0])).join(', ')}.</p><button class="btn" data-a="start" data-x="${k}">Iniciar ${d.l}</button></div>`;
  return h}
 const d=dn(S.act.k);
 h+=`<div class="card"><h2>${d.l} en curso</h2><p class="mu" style="margin:0">Empezó a las ${fd(S.act.date,{hour:'2-digit',minute:'2-digit'})}. Descanso entre series:</p>${rest()}</div>`;
 d.x.forEach(e=>{const l=S.act.logs[e.id],ok=l.sets.filter(s=>s.ok).length,ls=last(e.id),g=ls&&sug(e,ls);
  h+=`<details class="ex" data-id="${e.id}" ${OP.has(e.id)?'open':''}><summary><div><div class="en">${esc(e.n[l.v])}</div><div class="mu mono">${e.s} × ${e.a}–${e.b} · RIR ${e.r}</div></div><span class="badge ${ok>=e.s?'ok':''}">${ok}/${e.s}</span></summary><div class="bd">
  ${e.n.length>1?`<select data-f="v" data-x="${e.id}">${e.n.map((n,i)=>`<option value="${i}" ${i==l.v?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
  <p class="tip">${esc(e.t)}</p>${g?`<div class="sg ${g.t}">${g.m}</div>`:''}
  <div class="row lab"><span></span><span>Peso (kg)</span><span>Reps</span><span></span></div>
  ${l.sets.map((s,i)=>`<div class="row"><span class="mu">${i+1}</span><input inputmode="decimal" data-f="w" data-x="${e.id}" data-i="${i}" value="${esc(s.w)}"><input inputmode="numeric" data-f="r" data-x="${e.id}" data-i="${i}" value="${esc(s.r)}"><button class="ck ${s.ok?'on':''}" data-a="ck" data-x="${e.id}" data-i="${i}" aria-label="Serie ${i+1} hecha">✓</button></div>`).join('')}
  <button class="btn gh" data-a="add" data-x="${e.id}">+ Serie</button></div></details>`});
 return h+`<div class="card"><h2>Notas</h2><textarea rows="2" data-f="n" placeholder="Cómo fue la sesión">${esc(S.act.notes)}</textarea></div>
 <div style="display:flex;gap:10px"><button class="btn li" data-a="fin">Finalizar</button><button class="btn gh" data-a="cancel">Descartar</button></div>`}
function vProg(){const w=weekStats(),tot=Math.round(w.n);
 let h=`<h1>Progreso</h1>${cel()}<div class="grid" style="margin:14px 0"><div class="cell"><div class="mu">Volumen semanal</div><div class="num" style="color:var(--ac)">${w.t.toLocaleString('es-ES')} kg</div></div><div class="cell"><div class="mu">Series de la semana</div><div class="num" style="color:var(--li)">${tot}</div></div></div>
 <div class="card"><h2>Series efectivas por músculo</h2><p class="mu">Ponderadas por implicación. Rango óptimo semanal: 12–22.</p><div class="grid">${MU.map(m=>{const v=rd(w.v[m]),c=v<12?'var(--mu)':v<=22?'var(--li)':'var(--wa)';return`<div class="cell"><div>${m}</div><div class="num" style="color:${c}">${v}</div><div class="bar"><i style="width:${Math.min(100,v/12*100)}%;background:${c}"></i></div></div>`}).join('')}</div>
 <p class="mu" style="margin:10px 0 0">Gris: bajo 12 · Verde: 12–22 · Naranja: sobre 22.</p></div><div class="card"><h2>Récords (1RM estimado)</h2>`;
 const rows=Object.keys(EX).map(id=>{const pts=S.ss.filter(s=>s.logs[id]).reverse().map(s=>Math.max(...s.logs[id].sets.map(x=>e1(x.w,x.r))));return pts.length?{id,b:Math.max(...pts),pts}:0}).filter(Boolean);
 h+=rows.length?rows.map(r=>`<div class="li2"><div><div class="en">${esc(EX[r.id].n[0])}</div><div class="mu mono">${rd(r.b)} kg</div></div>${sp(r.pts)}</div>`).join(''):'<p class="mu">Aún no hay sesiones. Completa una para ver tus récords.</p>';
 return h+'</div>'}
function vHist(){return`<h1>Historial</h1><div style="margin-top:14px">${S.ss.length?S.ss.map(s=>{let n=0,t=0;for(const id in s.logs)s.logs[id].sets.forEach(x=>{n++;t+=x.w*x.r});
 return`<div class="card"><div class="li2" style="border:0;padding:0"><div><h2 style="margin:0">${dn(s.k).l}</h2><div class="mu">${fd(s.date)} · ${s.dur} min</div></div><button class="btn gh" data-a="del" data-x="${s.id}" style="padding:7px 12px">Borrar</button></div>
 <p class="mono" style="margin:10px 0 0">${n} series · ${Math.round(t).toLocaleString('es-ES')} kg</p>${s.notes?`<p class="mu" style="margin:6px 0 0">${esc(s.notes)}</p>`:''}</div>`}).join(''):'<p class="mu">Sin sesiones todavía. Empieza una desde Hoy.</p>'}</div>`}
function vAjus(){const p=S.p,bw=p.bw||0,mt=bw*33,tg=mt*(p.goal=='lean'?1.1:1.25),f=p.sex=='M'?[.8,1.2]:[1,1.3];
 const st=(l,v,s)=>`<div class="cell"><div class="mu">${l}</div><div class="num">${v}</div><div class="mu">${s}</div></div>`;
 return`<h1>Nutrición</h1><div class="card" style="margin-top:14px"><h2>Perfil</h2><p class="lab">Peso corporal (kg)</p><div style="display:flex;gap:8px;margin-bottom:12px"><input inputmode="decimal" id="bwin" data-f="bw" value="${bw}"><button class="btn" data-a="bwlog">Registrar</button></div>
 <div class="seg"><button class="${p.sex=='M'?'on':''}" data-a="sex" data-x="M">Hombre</button><button class="${p.sex=='F'?'on':''}" data-a="sex" data-x="F">Mujer</button></div>
 <div class="seg" style="margin:0"><button class="${p.goal=='lean'?'on':''}" data-a="goal" data-x="lean">Lean bulk +10%</button><button class="${p.goal!='lean'?'on':''}" data-a="goal" data-x="agg">Bulk agresivo +25%</button></div>${S.bw.length>1?`<div style="margin-top:12px">${sp(S.bw.map(x=>x.k))}<div class="mu">Últimos ${S.bw.length} registros de peso</div></div>`:''}</div>
 <div class="card"><h2>Objetivos diarios</h2><div class="grid">${st('Mantenimiento',Math.round(mt),'kcal')}${st('Objetivo',Math.round(tg),'kcal')}${st('Proteína',Math.round(bw*1.6)+'–'+Math.round(bw*2.2),'g · 1,6–2,2 g/kg')}${st('Grasas',Math.round(bw*f[0])+'–'+Math.round(bw*f[1]),'g')}${st('Creatina',rd(bw/10)+' g','1 g por 10 kg')}${st('Sueño','7–8 h','sin pantallas 1 h antes')}</div>
 <p class="mu" style="margin:10px 0 0">Mantenimiento estimado a 33 kcal/kg: ajústalo según cómo evolucione tu peso.</p></div>
 <div class="card"><h2>Descanso entre series</h2>${rest()}</div>
 <div class="card"><h2>Copia de seguridad</h2><p class="mu">Exporta para copiar tus datos; pega un JSON y pulsa Importar para restaurarlos.</p><textarea id="bk" rows="3"></textarea><div style="display:flex;gap:10px;margin-top:10px"><button class="btn gh" data-a="exp">Exportar</button><button class="btn" data-a="imp">Importar</button></div></div>`}
function render(){$('#v').innerHTML={hoy:vHoy,prog:vProg,hist:vHist,ajus:vAjus}[tab]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.x==tab))}
/* ---- temporizador (basado en hora real) ---- */
function tick(){const r=Math.ceil((T.end-Date.now())/1e3),f=$('#fab');
 if(r<=0){clearInterval(T.iv);f.classList.add('dn');$('#tm').textContent='¡Listo!';$('#ring').setAttribute('stroke-dashoffset',0);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}return}
 $('#tm').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');$('#ring').setAttribute('stroke-dashoffset',113.1*(1-r/S.p.rest))}
function startT(){clearInterval(T.iv);T.end=Date.now()+S.p.rest*1e3;$('#fab').className='on';tick();T.iv=setInterval(tick,250)}
function stopT(){clearInterval(T.iv);$('#fab').className=''}
/* ---- eventos ---- */
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.id)d.open?OP.add(d.dataset.id):OP.delete(d.dataset.id)},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,x=b.dataset.x,i=+b.dataset.i;
 if(a=='tab'){tab=x;render();scrollTo(0,0);return}
 if(a=='skip'){stopT();return}
 if(a=='pick')pick=x;
 if(a=='start'){startS(x)}
 if(a=='ck'){const s=S.act.logs[x].sets[i];if(!s.ok&&!(+s.w>0&&+s.r>0)){toast('Introduce peso y repeticiones');return}s.ok=!s.ok;save();if(s.ok)startT()}
 if(a=='add'){const l=S.act.logs[x].sets;l.push({w:l.length?l[l.length-1].w:'',r:'',ok:false})}
 if(a=='fin'){finish();return}
 if(a=='cancel'){if(!b.dataset.c){b.dataset.c=1;b.textContent='¿Seguro? Pulsa otra vez';return}S.act=null;stopT()}
 if(a=='cel')S.cel=null;
 if(a=='rest'){S.p.rest=+x}
 if(a=='del'){if(!b.dataset.c){b.dataset.c=1;b.textContent='¿Borrar?';return}S.ss=S.ss.filter(s=>s.id!=x)}
 if(a=='sex')S.p.sex=x;if(a=='goal')S.p.goal=x=='lean'?'lean':'agg';
 if(a=='bwlog'){const k=parseFloat(S.p.bw);if(!(k>0)){toast('Introduce un peso válido');return}const d=new Date().toISOString().slice(0,10);S.bw=S.bw.filter(y=>y.d!=d);S.bw.push({d,k});S.bw=S.bw.slice(-60);toast('Peso registrado')}
 if(a=='exp'){$('#bk').value=JSON.stringify(S);return}
 if(a=='imp'){try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.ss))throw 0;S=Object.assign(S,o);toast('Datos importados')}catch(_){toast('El JSON no es válido');return}}
 save();render()});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
 if(f=='w'||f=='r')S.act.logs[t.dataset.x].sets[+t.dataset.i][f]=t.value.replace(',','.');
 else if(f=='n')S.act.notes=t.value;else if(f=='bw')S.p.bw=parseFloat(t.value.replace(',','.'))||0;save()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f=='v'){S.act.logs[t.dataset.x].v=+t.value;save();render()}else if(t.dataset.f=='bw')render()});
render();
})();
</script>
</body>
</html>
