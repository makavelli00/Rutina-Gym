<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de Fuerza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EEE3;
    --panel:#FFFFFF;
    --panel-alt:#EAE3D2;
    --line:#D9D0B8;
    --text:#22221C;
    --text-dim:#726F5E;
    --accent:#A6631B;
    --accent-ink:#FFFFFF;
    --accent2:#33546E;
    --success:#3F7D53;
    --danger:#B5432B;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171A;
      --panel:#1E2126;
      --panel-alt:#262A31;
      --line:#343A42;
      --text:#ECEDEF;
      --text-dim:#8B909A;
      --accent:#E3A63B;
      --accent-ink:#15171A;
      --accent2:#6C9AC0;
      --success:#5FAE74;
      --danger:#E2694F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171A;
    --panel:#1E2126;
    --panel-alt:#262A31;
    --line:#343A42;
    --text:#ECEDEF;
    --text-dim:#8B909A;
    --accent:#E3A63B;
    --accent-ink:#15171A;
    --accent2:#6C9AC0;
    --success:#5FAE74;
    --danger:#E2694F;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:none;
    letter-spacing:0.01em;
    margin:0;
  }
  #app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--bg);
    padding:18px 16px 0 16px;
    border-bottom:1px solid var(--line);
  }
  header.top .title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  header.top h1{ font-size:22px; font-weight:600; }
  header.top .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .theme-btn{
    border:1px solid var(--line); background:var(--panel); color:var(--text-dim);
    border-radius:7px; padding:6px 10px; font-family:inherit; font-size:11px; cursor:pointer;
  }

  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; padding:14px 16px 12px 16px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:0 0 auto; font-family:'Oswald',sans-serif; font-size:14px; font-weight:500;
    padding:9px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); cursor:pointer; white-space:nowrap;
  }
  nav.tabs button[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  main{ flex:1; padding:4px 16px 40px 16px; }

  .date-nav{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:10px 0 4px 0; color:var(--text-dim);
  }
  .date-nav .date-label{ font-family:'Oswald',sans-serif; font-size:14px; color:var(--text); min-width:150px; text-align:center; }
  .day-head{ display:flex; align-items:center; justify-content:space-between; margin:10px 0 14px 0; }
  .day-head h2{ font-size:26px; font-weight:600; }
  .day-head .badge{
    font-size:11px; padding:4px 8px; border-radius:6px; background:var(--success); color:#fff;
    font-family:'JetBrains Mono',monospace;
  }
  .icon-btn{
    border:1px solid var(--line); background:var(--panel); color:var(--text);
    border-radius:8px; width:36px; height:36px; font-size:16px; cursor:pointer;
  }
  .row-actions{ display:flex; gap:8px; }

  .rest-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:28px 18px; text-align:center; color:var(--text-dim); font-size:14px;
  }

  .exercise{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 14px 10px 14px; margin-bottom:14px;
  }
  .exercise .ex-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .exercise .ex-name{ font-family:'Oswald',sans-serif; font-size:17px; font-weight:500; line-height:1.25; }
  .exercise .ex-target{
    font-size:11px; color:var(--text-dim); background:var(--panel-alt);
    border-radius:6px; padding:3px 7px; white-space:nowrap; margin-top:2px;
  }
  .exercise .ex-last{ font-size:11.5px; color:var(--text-dim); margin:6px 0 10px 0; }
  .exercise .ex-last b{ color:var(--accent2); font-weight:600; }
  .del-x{
    background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:2px 4px;
  }

  .set-row{
    display:grid; grid-template-columns:26px 1fr 1fr 34px; gap:8px; align-items:center;
    padding:7px 0; border-top:1px solid var(--line);
  }
  .set-row:first-of-type{ border-top:1px solid var(--line); }
  .set-num{ font-size:12px; color:var(--text-dim); text-align:center; }
  .set-row input[type="number"]{
    width:100%; font-family:'JetBrains Mono',monospace; font-size:15px;
    background:var(--panel-alt); border:1px solid var(--line); border-radius:7px;
    padding:8px 6px; color:var(--text); text-align:center;
  }
  .set-row input[type="number"]:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .set-row .unit{ font-size:10px; color:var(--text-dim); display:block; text-align:center; margin-top:2px; }
  .check-wrap{ display:flex; align-items:center; justify-content:center; }
  .check-wrap input[type="checkbox"]{
    width:26px; height:26px; accent-color:var(--success); cursor:pointer;
  }

  .add-ex-form{
    background:var(--panel-alt); border:1px dashed var(--line); border-radius:10px;
    padding:12px; margin-bottom:14px; display:flex; flex-direction:column; gap:8px;
  }
  .add-ex-form input{
    font-family:inherit; font-size:14px; padding:9px 10px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel); color:var(--text); width:100%;
  }
  .add-ex-form .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  button.primary{
    font-family:'Oswald',sans-serif; font-size:14px; font-weight:500; letter-spacing:.02em;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
    padding:12px 16px; cursor:pointer; width:100%;
  }
  button.ghost{
    font-family:'Oswald',sans-serif; font-size:13px; font-weight:500;
    background:transparent; color:var(--accent2); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px; cursor:pointer;
  }
  button.small{
    font-family:'JetBrains Mono',monospace; font-size:12px; padding:6px 10px; border-radius:6px;
    background:var(--panel); border:1px solid var(--line); color:var(--text); cursor:pointer;
  }

  .actions-footer{ display:flex; gap:10px; margin-top:6px; }

  select#exSelect{
    width:100%; font-family:'JetBrains Mono',monospace; font-size:14px; padding:10px;
    border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text);
    margin-bottom:14px;
  }
  .chart-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:16px;
  }
  canvas#chart{ width:100%; height:180px; display:block; }
  .empty-note{ text-align:center; color:var(--text-dim); font-size:13px; padding:20px 0; }

  .hist-item{
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:10px 12px; margin-bottom:8px; font-size:13px;
  }
  .hist-item .hdate{ font-family:'Oswald',sans-serif; font-size:13px; font-weight:500; color:var(--accent2); margin-bottom:3px; }
  .hist-item .sets-list{ color:var(--text-dim); }

  .danger-zone{ margin-top:26px; text-align:center; }
  .danger-zone button{
    background:none; border:none; color:var(--danger); font-size:12px; text-decoration:underline; cursor:pointer;
  }

  @media (min-width:420px){
    .set-row{ grid-template-columns:30px 1fr 1fr 40px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title-row">
      <h1>Cuaderno de Fuerza</h1>
      <button class="theme-btn" id="themeToggle">Tema</button>
    </div>
    <div class="sub" id="dateLine"></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_ROUTINE = 'gt_routine_v1';
  var STORAGE_SESSIONS = 'gt_sessions_v1';
  var STORAGE_THEME = 'gt_theme_v1';
  var STORAGE_SCHEDULE = 'gt_schedule_v1';
  var WEEKDAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var WEEKDAY_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  var DEFAULT_ROUTINE = [
    { id:'d1', name:'Torso A', rest:false, exercises:[
      { id:'d1e1', name:'Press Inclinado (mancuernas o multipower)', target:'3 x 6–10', rows:3 },
      { id:'d1e2', name:'Jalón al Pecho Prono', target:'3 x 8–12', rows:3 },
      { id:'d1e3', name:'Press Plano en Máquina', target:'3 x 8–12', rows:3 },
      { id:'d1e4', name:'Remo T / Apalancado', target:'3 x 8–12', rows:3 },
      { id:'d1e5', name:'Elevaciones Laterales en Polea', target:'3–4 x 10–15', rows:4 },
      { id:'d1e6', name:'Curl Inclinado con Mancuernas', target:'2–3 x 8–12', rows:3 },
      { id:'d1e7', name:'Extensión Tras Nuca en Polea', target:'2–3 x 8–12', rows:3 }
    ]},
    { id:'d2', name:'Pierna A', rest:false, exercises:[
      { id:'d2e1', name:'Sentadilla Hack o Prensa', target:'3–4 x 6–10', rows:4 },
      { id:'d2e2', name:'Curl Femoral Sentado', target:'3–4 x 8–12', rows:4 },
      { id:'d2e3', name:'Extensiones de Cuádriceps', target:'3 x 10–15', rows:3 },
      { id:'d2e4', name:'Peso Muerto Rumano', target:'3 x 8–10', rows:3 },
      { id:'d2e5', name:'Elevación de Talones', target:'3–4 x 10–15', rows:4 }
    ]},
    { id:'d3', name:'Descanso', rest:true, exercises:[] },
    { id:'d4', name:'Torso B', rest:false, exercises:[
      { id:'d4e1', name:'Fondos en Paralelas o Press Plano', target:'3 x 8–12', rows:3 },
      { id:'d4e2', name:'Remo Unilateral (mancuerna o palanca)', target:'3 x 8–12', rows:3 },
      { id:'d4e3', name:'Cruce de Poleas o Pec Deck', target:'3 x 10–15', rows:3 },
      { id:'d4e4', name:'Press Militar con Mancuernas', target:'3 x 8–10', rows:3 },
      { id:'d4e5', name:'Pájaros en Máquina o Face Pull', target:'3 x 12–15', rows:3 },
      { id:'d4e6', name:'Curl Predicador o Curl Martillo', target:'2–3 x 10–12', rows:3 },
      { id:'d4e7', name:'Pushdown de Tríceps en Polea', target:'2–3 x 10–15', rows:3 }
    ]},
    { id:'d5', name:'Pierna B', rest:false, exercises:[
      { id:'d5e1', name:'Zancadas o Sentadilla Búlgara', target:'3 x 8–12 /pierna', rows:3 },
      { id:'d5e2', name:'Curl Femoral Tumbado', target:'3 x 8–12', rows:3 },
      { id:'d5e3', name:'Aducción en Máquina', target:'3 x 12–15', rows:3 },
      { id:'d5e4', name:'Hip Thrust en Multipower', target:'3 x 8–12', rows:3 },
      { id:'d5e5', name:'Elevación de Talones', target:'3–4 x 10–15', rows:4 }
    ]}
  ];

  // index 0 = Lunes ... 6 = Domingo
  var DEFAULT_SCHEDULE = ['d1','d2','d3','d4','d5','d3','d3'];

  function loadSchedule(){
    try{
      var raw = localStorage.getItem(STORAGE_SCHEDULE);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    var fresh = DEFAULT_SCHEDULE.slice();
    saveSchedule(fresh);
    return fresh;
  }
  function saveSchedule(s){
    try{ localStorage.setItem(STORAGE_SCHEDULE, JSON.stringify(s)); }catch(e){}
  }

  function loadRoutine(){
    try{
      var raw = localStorage.getItem(STORAGE_ROUTINE);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    var fresh = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
    saveRoutine(fresh);
    return fresh;
  }
  function saveRoutine(r){
    try{ localStorage.setItem(STORAGE_ROUTINE, JSON.stringify(r)); }catch(e){}
  }
  function loadSessions(){
    try{
      var raw = localStorage.getItem(STORAGE_SESSIONS);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return [];
  }
  function saveSessions(s){
    try{ localStorage.setItem(STORAGE_SESSIONS, JSON.stringify(s)); }catch(e){}
  }

  var routine = loadRoutine();
  var sessions = loadSessions();
  var schedule = loadSchedule();

  function todayStr(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }
  function fmtDate(iso){
    var p = iso.split('-');
    return p[2]+'/'+p[1]+'/'+p[0].slice(2);
  }
  function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function dateFromISO(iso){
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]);
  }
  function isoFromDate(d){
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }
  function addDaysISO(iso, n){
    var d = dateFromISO(iso);
    d.setDate(d.getDate()+n);
    return isoFromDate(d);
  }
  function weekdayMon0(iso){
    var wd = dateFromISO(iso).getDay(); // 0=Sun..6=Sat
    return (wd+6)%7; // 0=Mon..6=Sun
  }
  function mondayOfWeek(iso){
    return addDaysISO(iso, -weekdayMon0(iso));
  }
  function scheduledDayId(iso){
    return schedule[weekdayMon0(iso)] || routine[0].id;
  }

  var state = { view:'day', date: todayStr(), dayId: scheduledDayId(todayStr()), editMode:false, weekStart: mondayOfWeek(todayStr()), editSchedule:false };

  function findDay(dayId){
    for(var i=0;i<routine.length;i++) if(routine[i].id===dayId) return routine[i];
    return routine[0];
  }

  function getOrCreateSession(dayId, dateStr){
    var t = dateStr || todayStr();
    var existing = sessions.find(function(s){ return s.dayId===dayId && s.date===t; });
    if(existing) return existing;
    var day = findDay(dayId);
    var data = {};
    day.exercises.forEach(function(ex){
      data[ex.id] = [];
      for(var i=0;i<ex.rows;i++) data[ex.id].push({w:'', r:'', done:false});
    });
    var sess = { id:uid(), dayId:dayId, date:t, completed:false, data:data };
    sessions.push(sess);
    saveSessions(sessions);
    return sess;
  }
  function findSession(dayId, dateStr){
    return sessions.find(function(s){ return s.dayId===dayId && s.date===dateStr; }) || null;
  }

  function ensureExerciseRows(sess, ex){
    if(!sess.data[ex.id]) sess.data[ex.id] = [];
    while(sess.data[ex.id].length < ex.rows) sess.data[ex.id].push({w:'', r:'', done:false});
  }

  function lastRecordFor(dayId, exerciseId, excludeSessionId){
    var past = sessions
      .filter(function(s){ return s.dayId===dayId && s.id!==excludeSessionId && s.data[exerciseId]; })
      .filter(function(s){ return s.data[exerciseId].some(function(r){ return r.w!=='' || r.r!==''; }); })
      .sort(function(a,b){ return b.date.localeCompare(a.date); });
    if(!past.length) return null;
    var s = past[0];
    var parts = s.data[exerciseId]
      .filter(function(r){ return r.w!=='' || r.r!==''; })
      .map(function(r){ return (r.w||'?')+'kg×'+(r.r||'?'); });
    return { date:s.date, text: parts.join(', ') };
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- RENDER ----------
  function render(){
    document.getElementById('dateLine').textContent = new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
    renderTabs();
    if(state.view==='day') renderDayView();
    else if(state.view==='week') renderWeekView();
    else renderProgressView();
  }

  function renderTabs(){
    var tabs = document.getElementById('tabs');
    var html = '';
    routine.forEach(function(d){
      var sel = (state.view==='day' && state.dayId===d.id);
      html += '<button data-tab="day:'+d.id+'" aria-selected="'+sel+'">'+escapeHtml(d.name)+'</button>';
    });
    html += '<button data-tab="week" aria-selected="'+(state.view==='week')+'">Semana</button>';
    html += '<button data-tab="progress" aria-selected="'+(state.view==='progress')+'">Progreso</button>';
    tabs.innerHTML = html;
  }

  function renderDayView(){
    var main = document.getElementById('main');
    var day = findDay(state.dayId);

    if(day.rest){
      main.innerHTML =
        '<div class="day-head"><h2>'+escapeHtml(day.name)+'</h2></div>'+
        '<div class="rest-card">Día de descanso. Aprovechá para recuperar — el músculo crece acá.</div>';
      return;
    }

    var sess = getOrCreateSession(day.id, state.date);
    day.exercises.forEach(function(ex){ ensureExerciseRows(sess, ex); });

    var isToday = state.date === todayStr();
    var wdLabel = WEEKDAY_NAMES[weekdayMon0(state.date)];

    var html = '<div class="date-nav">'+
      '<button class="icon-btn" data-action="date-prev" title="Día anterior">‹</button>'+
      '<div class="date-label">'+escapeHtml(wdLabel)+' '+escapeHtml(fmtDate(state.date))+(isToday?' · hoy':'')+'</div>'+
      '<button class="icon-btn" data-action="date-next" title="Día siguiente">›</button>'+
      (isToday?'':'<button class="small" data-action="date-today">Hoy</button>')+
      '</div>';

    html += '<div class="day-head"><h2>'+escapeHtml(day.name)+'</h2>'+
      '<div class="row-actions">'+
      (sess.completed ? '<span class="badge">Completado</span>' : '') +
      '<button class="icon-btn" data-action="toggle-edit" title="Editar ejercicios">'+(state.editMode?'✓':'✎')+'</button>'+
      '</div></div>';

    day.exercises.forEach(function(ex){
      var last = lastRecordFor(day.id, ex.id, sess.id);
      html += '<div class="exercise">'+
        '<div class="ex-head"><div><div class="ex-name">'+escapeHtml(ex.name)+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:6px;">'+
        '<span class="ex-target">'+escapeHtml(ex.target)+'</span>'+
        (state.editMode ? '<button class="del-x" data-action="del-ex" data-ex="'+ex.id+'" title="Eliminar ejercicio">✕</button>' : '')+
        '</div></div>'+
        '<div class="ex-last">'+(last ? 'Última vez ('+fmtDate(last.date)+'): <b>'+escapeHtml(last.text)+'</b>' : 'Sin registros previos') +'</div>';

      sess.data[ex.id].forEach(function(row, idx){
        html += '<div class="set-row">'+
          '<div class="set-num">'+(idx+1)+'</div>'+
          '<div><input type="number" inputmode="decimal" placeholder="—" value="'+escapeHtml(row.w)+'" data-action="set-w" data-ex="'+ex.id+'" data-idx="'+idx+'">'+
          '<span class="unit">kg</span></div>'+
          '<div><input type="number" inputmode="numeric" placeholder="—" value="'+escapeHtml(row.r)+'" data-action="set-r" data-ex="'+ex.id+'" data-idx="'+idx+'">'+
          '<span class="unit">reps</span></div>'+
          '<div class="check-wrap"><input type="checkbox" data-action="set-done" data-ex="'+ex.id+'" data-idx="'+idx+'" '+(row.done?'checked':'')+'></div>'+
          '</div>';
      });
      html += '</div>';
    });

    if(state.editMode){
      html += '<div class="add-ex-form">'+
        '<input type="text" id="newExName" placeholder="Nombre del ejercicio">'+
        '<div class="grid2">'+
        '<input type="number" id="newExRows" placeholder="Series (ej: 3)" min="1" max="8">'+
        '<input type="text" id="newExTarget" placeholder="Objetivo (ej: 3 x 8–12)">'+
        '</div>'+
        '<button class="ghost" data-action="add-ex">+ Agregar ejercicio</button>'+
        '</div>';
    }

    html += '<div class="actions-footer">'+
      '<button class="primary" data-action="toggle-complete">'+(sess.completed?'Desmarcar como completado':'Marcar entrenamiento como completado')+'</button>'+
      '</div>';

    main.innerHTML = html;
  }

  function allExercisesFlat(){
    var list = [];
    routine.forEach(function(d){
      if(d.rest) return;
      d.exercises.forEach(function(ex){
        list.push({ dayId:d.id, dayName:d.name, exId:ex.id, exName:ex.name });
      });
    });
    return list;
  }

  function renderWeekView(){
    var main = document.getElementById('main');
    var t = todayStr();
    var isCurrentWeek = state.weekStart === mondayOfWeek(t);
    var monthLabel = new Date(dateFromISO(state.weekStart)).toLocaleDateString('es-AR', { month:'long', year:'numeric' });

    var html = '<div class="day-head"><h2>Semana</h2>'+
      '<button class="icon-btn" data-action="toggle-edit-schedule" title="Editar horario">'+(state.editSchedule?'✓':'✎')+'</button>'+
      '</div>';

    html += '<div class="date-nav">'+
      '<button class="icon-btn" data-action="week-prev" title="Semana anterior">‹</button>'+
      '<div class="date-label">'+escapeHtml(monthLabel)+'</div>'+
      '<button class="icon-btn" data-action="week-next" title="Semana siguiente">›</button>'+
      (isCurrentWeek?'':'<button class="small" data-action="week-today">Esta semana</button>')+
      '</div>';

    if(state.editSchedule){
      html += '<div class="add-ex-form">';
      WEEKDAY_NAMES.forEach(function(name, wd){
        html += '<div style="display:flex;align-items:center;gap:8px;">'+
          '<div style="width:78px;font-family:Oswald,sans-serif;font-size:13px;">'+name+'</div>'+
          '<select class="sched-select" data-wd="'+wd+'" style="flex:1;font-family:inherit;font-size:13px;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);">'+
          routine.map(function(d){ return '<option value="'+d.id+'" '+(schedule[wd]===d.id?'selected':'')+'>'+escapeHtml(d.name)+'</option>'; }).join('')+
          '</select></div>';
      });
      html += '</div>';
    }

    for(var i=0;i<7;i++){
      var dateStr = addDaysISO(state.weekStart, i);
      var dId = schedule[i] || routine[0].id;
      var d = findDay(dId);
      var sess = findSession(dId, dateStr);
      var isFuture = dateStr > t;
      var isToday = dateStr === t;

      var statusHtml = '';
      if(d.rest){
        statusHtml = '<span style="color:var(--text-dim);">Descanso</span>';
      } else if(sess && sess.completed){
        statusHtml = '<span style="color:var(--success);font-weight:600;">✓ Completado</span>';
      } else if(sess){
        statusHtml = '<span style="color:var(--accent2);">● En progreso</span>';
      } else if(isFuture){
        statusHtml = '<span style="color:var(--text-dim);">— Programado</span>';
      } else {
        statusHtml = '<span style="color:var(--danger);">Sin registrar</span>';
      }

      var clickable = !d.rest;
      html += '<div class="hist-item" style="display:flex;justify-content:space-between;align-items:center;'+(isToday?'border-color:var(--accent);':'')+(clickable?'cursor:pointer;':'')+'"'+
        (clickable ? ' data-action="goto-date" data-date="'+dateStr+'" data-day="'+dId+'"' : '')+'>'+
        '<div><div class="hdate">'+WEEKDAY_SHORT[i]+' '+fmtDate(dateStr).slice(0,5)+(isToday?' · hoy':'')+'</div>'+
        '<div class="sets-list">'+escapeHtml(d.name)+'</div></div>'+
        '<div style="font-size:12px;text-align:right;">'+statusHtml+'</div>'+
        '</div>';
    }

    main.innerHTML = html;
  }

  var progressSelected = null;

  function renderProgressView(){
    var main = document.getElementById('main');
    var flat = allExercisesFlat();
    if(!progressSelected && flat.length) progressSelected = flat[0].dayId+'|'+flat[0].exId;

    var html = '<div class="day-head"><h2>Progreso</h2></div>';
    if(!flat.length){
      main.innerHTML = html + '<div class="rest-card">Todavía no hay ejercicios cargados.</div>';
      return;
    }

    html += '<select id="exSelect">';
    var grouped = {};
    flat.forEach(function(f){ (grouped[f.dayName] = grouped[f.dayName]||[]).push(f); });
    Object.keys(grouped).forEach(function(dayName){
      html += '<optgroup label="'+escapeHtml(dayName)+'">';
      grouped[dayName].forEach(function(f){
        var val = f.dayId+'|'+f.exId;
        html += '<option value="'+val+'" '+(val===progressSelected?'selected':'')+'>'+escapeHtml(f.exName)+'</option>';
      });
      html += '</optgroup>';
    });
    html += '</select>';

    var parts = progressSelected.split('|');
    var dayId = parts[0], exId = parts[1];

    var relevant = sessions
      .filter(function(s){ return s.dayId===dayId && s.data[exId]; })
      .map(function(s){
        var weights = s.data[exId].map(function(r){ return parseFloat(r.w); }).filter(function(n){ return !isNaN(n); });
        if(!weights.length) return null;
        return { date:s.date, top: Math.max.apply(null, weights), sets: s.data[exId] };
      })
      .filter(Boolean)
      .sort(function(a,b){ return a.date.localeCompare(b.date); });

    html += '<div class="chart-card">';
    if(relevant.length < 2){
      html += '<div class="empty-note">Registrá al menos 2 entrenamientos de este ejercicio para ver el gráfico de progreso.</div>';
    } else {
      html += '<canvas id="chart" width="600" height="180"></canvas>';
    }
    html += '</div>';

    var histSorted = relevant.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    if(!histSorted.length){
      html += '<div class="empty-note">Sin registros todavía para este ejercicio.</div>';
    } else {
      histSorted.forEach(function(h){
        var setsTxt = h.sets.filter(function(r){ return r.w!=='' || r.r!==''; })
          .map(function(r){ return (r.w||'?')+'kg×'+(r.r||'?'); }).join('  ·  ');
        html += '<div class="hist-item"><div class="hdate">'+fmtDate(h.date)+'</div><div class="sets-list">'+escapeHtml(setsTxt)+'</div></div>';
      });
    }

    html += '<div class="danger-zone"><button data-action="reset-all">Borrar todos los datos</button></div>';

    main.innerHTML = html;

    if(relevant.length >= 2){
      drawChart(document.getElementById('chart'), relevant);
    }
  }

  function drawChart(canvas, points){
    var ctx = canvas.getContext('2d');
    var cssWidth = canvas.clientWidth || 600;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cssWidth * dpr;
    canvas.height = 180 * dpr;
    ctx.scale(dpr, dpr);
    var W = cssWidth, H = 180;
    ctx.clearRect(0,0,W,H);

    var styles = getComputedStyle(document.documentElement);
    var lineColor = styles.getPropertyValue('--line').trim() || '#ccc';
    var accent = styles.getPropertyValue('--accent').trim() || '#a66';
    var textDim = styles.getPropertyValue('--text-dim').trim() || '#888';
    var text = styles.getPropertyValue('--text').trim() || '#222';

    var padL = 34, padR = 12, padT = 14, padB = 22;
    var values = points.map(function(p){ return p.top; });
    var minV = Math.min.apply(null, values);
    var maxV = Math.max.apply(null, values);
    if(minV === maxV){ minV -= 5; maxV += 5; }
    var rangePad = (maxV - minV) * 0.15;
    minV -= rangePad; maxV += rangePad;

    function xAt(i){ return padL + (i/(points.length-1)) * (W - padL - padR); }
    function yAt(v){ return padT + (1 - (v - minV) / (maxV - minV)) * (H - padT - padB); }

    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1;
    ctx.font = '10px JetBrains Mono, monospace';
    ctx.fillStyle = textDim;
    var gridLines = 3;
    for(var g=0; g<=gridLines; g++){
      var v = minV + (maxV-minV)*g/gridLines;
      var y = yAt(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
      ctx.fillText(Math.round(v)+'', 2, y+3);
    }

    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    points.forEach(function(p, i){
      var x = xAt(i), y = yAt(p.top);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();

    ctx.fillStyle = accent;
    points.forEach(function(p, i){
      var x = xAt(i), y = yAt(p.top);
      ctx.beginPath(); ctx.arc(x,y,3.2,0,Math.PI*2); ctx.fill();
    });

    ctx.fillStyle = text;
    ctx.font = '10px JetBrains Mono, monospace';
    var step = Math.ceil(points.length / 5);
    points.forEach(function(p, i){
      if(i % step !== 0 && i !== points.length-1) return;
      var x = xAt(i);
      ctx.fillText(fmtDate(p.date).slice(0,5), Math.max(padL, Math.min(x-14, W-40)), H-6);
    });
  }

  // ---------- EVENTS ----------
  document.getElementById('tabs').addEventListener('click', function(e){
    var btn = e.target.closest('[data-tab]');
    if(!btn) return;
    var val = btn.getAttribute('data-tab');
    if(val === 'progress'){ state.view = 'progress'; }
    else if(val === 'week'){ state.view = 'week'; }
    else { state.view = 'day'; state.dayId = val.split(':')[1]; state.date = todayStr(); state.editMode = false; }
    render();
  });

  document.getElementById('themeToggle').addEventListener('click', function(){
    var cur = localStorage.getItem(STORAGE_THEME) || 'auto';
    var next = cur === 'dark' ? 'light' : (cur === 'light' ? 'auto' : 'dark');
    localStorage.setItem(STORAGE_THEME, next);
    applyTheme();
  });

  function applyTheme(){
    var t = localStorage.getItem(STORAGE_THEME) || 'auto';
    if(t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  document.getElementById('main').addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.getAttribute('data-action');
    var day = findDay(state.dayId);

    if(action === 'toggle-edit'){
      state.editMode = !state.editMode;
      render();
    }
    else if(action === 'toggle-complete'){
      var sess = getOrCreateSession(day.id, state.date);
      sess.completed = !sess.completed;
      saveSessions(sessions);
      render();
    }
    else if(action === 'date-prev'){
      state.date = addDaysISO(state.date, -1);
      state.dayId = scheduledDayId(state.date);
      render();
    }
    else if(action === 'date-next'){
      state.date = addDaysISO(state.date, 1);
      state.dayId = scheduledDayId(state.date);
      render();
    }
    else if(action === 'date-today'){
      state.date = todayStr();
      state.dayId = scheduledDayId(state.date);
      render();
    }
    else if(action === 'week-prev'){
      state.weekStart = addDaysISO(state.weekStart, -7);
      render();
    }
    else if(action === 'week-next'){
      state.weekStart = addDaysISO(state.weekStart, 7);
      render();
    }
    else if(action === 'week-today'){
      state.weekStart = mondayOfWeek(todayStr());
      render();
    }
    else if(action === 'goto-date'){
      var dateStr = t.getAttribute('data-date');
      var dId = t.getAttribute('data-day');
      if(findDay(dId).rest) return;
      state.view = 'day'; state.date = dateStr; state.dayId = dId; state.editMode = false;
      render();
    }
    else if(action === 'toggle-edit-schedule'){
      state.editSchedule = !state.editSchedule;
      render();
    }
    else if(action === 'del-ex'){
      var exId = t.getAttribute('data-ex');
      if(confirm('¿Eliminar este ejercicio de la rutina? El historial guardado no se borra.')){
        day.exercises = day.exercises.filter(function(ex){ return ex.id !== exId; });
        saveRoutine(routine);
        render();
      }
    }
    else if(action === 'add-ex'){
      var nameInp = document.getElementById('newExName');
      var rowsInp = document.getElementById('newExRows');
      var targetInp = document.getElementById('newExTarget');
      var name = nameInp.value.trim();
      var rows = parseInt(rowsInp.value, 10) || 3;
      var target = targetInp.value.trim() || (rows+' x —');
      if(!name){ nameInp.focus(); return; }
      var newId = day.id + 'e' + Date.now().toString(36);
      day.exercises.push({ id:newId, name:name, target:target, rows: Math.max(1, Math.min(8,rows)) });
      saveRoutine(routine);
      render();
    }
    else if(action === 'reset-all'){
      if(confirm('Esto borra TODA la rutina y el historial guardado. ¿Continuar?')){
        localStorage.removeItem(STORAGE_ROUTINE);
        localStorage.removeItem(STORAGE_SESSIONS);
        localStorage.removeItem(STORAGE_SCHEDULE);
        routine = loadRoutine();
        sessions = loadSessions();
        schedule = loadSchedule();
        progressSelected = null;
        state.date = todayStr();
        state.view = 'day'; state.dayId = scheduledDayId(state.date);
        render();
      }
    }
  });

  document.getElementById('main').addEventListener('input', function(e){
    var t = e.target;
    var action = t.getAttribute('data-action');
    if(!action) return;
    var exId = t.getAttribute('data-ex');
    var idx = parseInt(t.getAttribute('data-idx'), 10);
    var day = findDay(state.dayId);
    var sess = getOrCreateSession(day.id, state.date);
    if(!sess.data[exId] || !sess.data[exId][idx]) return;

    if(action === 'set-w') sess.data[exId][idx].w = t.value;
    else if(action === 'set-r') sess.data[exId][idx].r = t.value;
    saveSessions(sessions);

    if(action === 'set-w' || action === 'set-r'){
      var exObj = day.exercises.find(function(ex){ return ex.id===exId; });
      var lastLine = t.closest('.exercise').querySelector('.ex-last');
      if(lastLine && exObj){
        // no re-render needed mid-typing; last-record text only updates on next full render
      }
    }
  });

  document.getElementById('main').addEventListener('change', function(e){
    var t = e.target;
    if(t.getAttribute('data-action') === 'set-done'){
      var exId = t.getAttribute('data-ex');
      var idx = parseInt(t.getAttribute('data-idx'), 10);
      var day = findDay(state.dayId);
      var sess = getOrCreateSession(day.id, state.date);
      if(sess.data[exId] && sess.data[exId][idx]){
        sess.data[exId][idx].done = t.checked;
        saveSessions(sessions);
      }
    }
    if(t.id === 'exSelect'){
      progressSelected = t.value;
      renderProgressView();
    }
    if(t.classList.contains('sched-select')){
      var wd = parseInt(t.getAttribute('data-wd'), 10);
      schedule[wd] = t.value;
      saveSchedule(schedule);
      render();
    }
  });

  applyTheme();
  render();
})();
</script>
</body>
</html>
